# Small elliptic case for the driver tests (tests/integration/test_elliptic_driver.py):
# 2D grad-curl 1-forms on a cylinder (periodic in x, essential in y), one harmonic form (dy).

model:
 type: elliptic

mesh:
 type: rectangle
 periodic_directions: [x]
 nx: 4
 ny: 4
 nz: 4
 simplicial_cells: false

spatial-discretization:
 family: Q
 order: 1
 lump_mass: false

elliptic:
 form_degree: 1
 complex: grad-curl
 boundary_conditions:
  bottom: essential
  top: essential
 boundary_data: exact
 harmonic_forms: auto
 harmonic_constraint: lagrange
 solver: elliptic-direct

elliptic-problem:
 name: sine
 Lx: 1.0
 Ly: 1.25

output:
 outfile_name: runs/elliptic-test/sim
 loglevel: 0
 output_aux_vars: false
 output_freq: 1
 stat_freq: 1
