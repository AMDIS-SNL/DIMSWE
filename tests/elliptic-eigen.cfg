# Small eigenproblem for the driver tests: 2D grad-curl 1-forms on a cylinder (periodic in x,
# natural in y), one harmonic 1-form (dx).

model:
 type: elliptic-eigen

mesh:
 type: rectangle
 periodic_directions: [x]
 nx: 6
 ny: 6
 nz: 6
 simplicial_cells: false

spatial-discretization:
 family: Q
 order: 2
 lump_mass: false

elliptic:
 form_degree: 1
 complex: grad-curl
 boundary_conditions:
  bottom: natural
  top: natural
 harmonic_forms: auto
 eigen:
  nev: 6
  target: -1.0
  tolerance: 1.0e-10

elliptic-problem:
 Lx: 1.0
 Ly: 1.25

output:
 outfile_name: runs/elliptic-eigen-test/sim
 loglevel: 0
 output_aux_vars: false
 output_freq: 1
 stat_freq: 1
