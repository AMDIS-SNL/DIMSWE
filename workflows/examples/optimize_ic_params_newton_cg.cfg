# Step 2 example, second-order counterpart of optimize_ic_params.cfg: the same problem (truth
# runs, parameters, window, losses) solved with Newton-CG, which uses Hessian-vector products
# (forward-over-adjoint, see docs/hessian_vector_products.md) instead of L-BFGS-B's gradient-only
# quasi-Newton updates. Only optimization_name and the optimizer section differ, so the two runs
# can be compared job by job (nit, nfev, njev, nhvp in result.yaml and history.csv).
# The ic-params target has no bounds, so Newton-CG (which cannot handle bounds) applies directly.
# Run with:  bash workflows/optimize_params.sh 4 workflows/examples/optimize_ic_params_newton_cg.cfg
optimization_name: doublevortex-params-newton-cg
truth:
  manifest: ../generated/truth-doublevortex/manifest.yaml
  mode: per-run
target: ic-params
parameters:
  initial-conditions.ox: {initial: 0.1, scale: 0.1}
  initial-conditions.oy: {initial: 0.105, scale: 0.1}
window:
  num_steps: 16
losses:
  - {type: final}
  - {type: trajectory, obs_every: 4}
normalize: true
optimizer:
  method: Newton-CG
  use_hessp: true            # explicit; null (the default) also selects HVPs for Newton-CG
  # Newton-CG stops on xtol, the average relative change of the scaled parameters, not on gtol
  # (gtol is not passed to Newton-CG; it is kept so result.yaml records the same gtol_used)
  xtol: 1.0e-8
  gtol: 1.0e-8
  ftol: 1.0e-12              # unused by Newton-CG; kept identical to the first-order example
  maxiter: 20                # Newton iterations; each costs one gradient plus a few HVPs
output_root: runs/optimizations
