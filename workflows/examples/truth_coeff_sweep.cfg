# Step 1 example: truth runs that vary moist-physics coefficients.
# Generate with:  bash workflows/generate_cfgs.sh workflows/examples/truth_coeff_sweep.cfg
# Run with:       bash workflows/run_batch.sh 4 --skip-existing --manifest workflows/generated/truth-physics/manifest.yaml
template_cfg: ../../mtswe.cfg
sweep_name: truth-physics
output_root: runs/truth
#run_name_template: "gamma-{threewayphysics_gamma_r}__qprecip-{threewayphysics_qprecip}"
run_name_template: "L-{threewayphysics_L}"
strict_paths: true
parameters:
  threewayphysics.L: {linspace: [6, 12, 3]}
#  threewayphysics.gamma_r: {linspace: [0.0008, 0.0012, 2]}
#  threewayphysics.qprecip: {geomspace: [0.00008, 0.000125, 2]}
fixed:
  # short, frequently saved runs: each optimization iteration integrates the training window
  # twice (forward and adjoint) and holds every state of the window in memory
  mesh.nx: 25
  mesh.ny: 25
  timestepping.dt: 800
  timestepping.num_steps: 60
  output.output_freq: 2
  output.stat_freq: 1
  threewayphysics.treat_as_coeffs: false
  hyperviscosity.treat_as_coeffs: false
