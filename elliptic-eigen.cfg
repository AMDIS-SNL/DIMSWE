# Hodge Laplacian eigenproblem for k-forms (see TODO-elliptic.md §4.11).
# Run with: python run_model.py elliptic-eigen.cfg ; plot with: python plot_model.py elliptic-eigen.cfg

model:
 type: elliptic-eigen

mesh:
 type: rectangle
 periodic_directions: [x]      # cylinder: one harmonic 1-form (dx with natural y faces)
 nx: 16
 ny: 16
 nz: 16
 simplicial_cells: false

spatial-discretization:
 family: Q
 order: 2
 lump_mass: false

elliptic:
 form_degree: 1
 complex: grad-curl
 boundary_conditions:          # homogeneous: essential | natural per bounded face
  bottom: natural
  top: natural
 harmonic_forms: auto
 eigen:
  nev: 12                      # number of eigenpairs (one output step per mode)
  target: -1.0                 # shift-and-invert target, just below the spectrum
  tolerance: 1.0e-10
  deflate_harmonic: false      # true: deflate the known harmonic forms instead of computing them

elliptic-problem:              # only the domain is used
 Lx: 1.0
 Ly: 1.0

output:
 outfile_name: runs/elliptic-eigen/sim
 loglevel: 0
 output_aux_vars: false
 output_freq: 1
 stat_freq: 1
