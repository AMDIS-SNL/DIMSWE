runs:
  - run_dir: ../../runs/mtswe-cf
    label: "CF"
  - run_dir: ../../runs/mtswe-lp
    label: "LP"
  - run_dir: ../../runs/mtswe-h1
    label: "H1"
reference: CF          # differences are drawn as <run> - CF
differences: true
samples_per_cell: 4    # used if the runs' meshes are numbered differently
quantities:
  fields:
    - h
    - eta
    - Qv
    - Qc
    - Qr
    - Qv_l
    - Qc_l
    - Qr_l
    # positivity: cell means and whole-cell minima of the moisture densities
    - Qv_cellmean
    - Qv_cellmin
    - Qc_cellmean
    - Qc_cellmin
    - Qr_cellmean
    - Qr_cellmin
  statistics:
    - total_energy
    - total_h
    - total_water
    - total_Qv
    - total_Qc
    - total_Qr
    # positivity: domain minima of the cell means and whole-cell minima
    - h_cellmin_min
    - Qv_cellmean_min
    - Qv_cellmin_min
    - Qc_cellmean_min
    - Qc_cellmin_min
    - Qr_cellmean_min
    - Qr_cellmin_min
time_selection:
  frames: [0, 5, 10, 20]
output:
  outdir: ../../runs/comparisons/mtswe-h1-cf-lp
