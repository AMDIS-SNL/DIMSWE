output:
 loglevel: 100
 output_freq: 10
 stat_freq: 1
 output_aux_vars: false
 outfile_name: sim

plot:
 static_plots: false

initial-conditions:
 name: planewave
 
mesh: 
 type: box-periodic
 nx: 20
 ny: 20
 nz: 20
 diagonal: crossed
 simplicial_cells: false

model:
 class: metriplectic
 type: maxwell
 forcing_terms: []

spatial-discretization:
 order: 1
 family: Q
 lump_mass: false

timestepping:
 method: AVF2
 dt_type: cfl
 cfl_const: 0.5
 num_steps: 100
 avf_solver : qn #fixedpoint qn
 num_avf_quad: 1 



   

