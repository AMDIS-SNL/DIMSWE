# Step 1 example: truth runs that vary the double-vortex initial-condition offsets.
# Generate with:  bash workflows/generate_cfgs.sh workflows/examples/truth_ic_sweep.cfg
# Run with:       bash workflows/run_batch.sh 4 --skip-existing --manifest workflows/generated/truth-doublevortex/manifest.yaml
template_cfg: ../../mtswe.cfg
sweep_name: truth-doublevortex
output_root: runs/truth
run_name_template: "ox-{initial-conditions_ox}"
strict_paths: true
parameters:
  initial-conditions.ox: {random: {low: 0.08, high: 0.12, n: 3, seed: 7}}
fixed:
  initial-conditions.oy: 0.1
  mesh.nx: 25
  mesh.ny: 25
  timestepping.dt: 800
  timestepping.num_steps: 60
  output.output_freq: 2
  output.stat_freq: 1
