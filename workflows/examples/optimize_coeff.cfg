# Step 2 example: recover moist-physics coefficients from the truth-physics sweep.
# Run with:  bash workflows/optimize_params.sh 4 workflows/examples/optimize_coeff.cfg
optimization_name: physics-recovery
truth:
  manifest: ../generated/truth-physics/manifest.yaml
  mode: per-run              # per-run: one optimization per truth run; joint: one over all runs
target: coeffs
parameters:
#  threewayphysics.gamma_r: {initial: 0.0015, bounds: [1.0e-5, 0.01], scale: 0.001}
#  threewayphysics.qprecip: {initial: 0.00007, bounds: [1.0e-6, 0.001], scale: 0.0001}
#  threewayphysics.L: {fixed: 10.0}  # held at this value; omitted coefficients keep their truth value
  threewayphysics.L: {initial: 7., bounds: [5., 13.]}  # held at this value; omitted coefficients keep their truth value
window:
  start_index: 0             # truth output index where the training window starts
  num_steps: 20              # model steps in the training window
losses:
  - {type: final}                            # compare once, at the end of the window
  - {type: windowed, window_steps: 4}        # restart from the truth every 4 steps
  - {type: trajectory, obs_every: 2}         # one run, compared at every truth output
normalize: true
optimizer:
  method: L-BFGS-B
  gtol: 1.0e-8
  ftol: 1.0e-12
  maxiter: 60
  check_gradient: false
output_root: runs/optimizations
