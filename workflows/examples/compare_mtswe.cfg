runs:
  - run_dir: ../../runs/mtswe-cf
    label: "CF"
  - run_dir: ../../runs/mtswe-lp
    label: "LP"
  - run_dir: ../../runs/mtswe-h1
    label: "H1"
reference: CF          # differences are drawn as <run> - CF
differences: true
samples_per_cell: 4    # used if the runs' meshes are numbered differently
quantities:
  fields: [h, eta]
  statistics: [total_energy, total_h]
time_selection:
  frames: [0, 5, 10, 20]
output:
  outdir: ../../runs/comparisons/mtswe-h1-cf-lp
