# Step 2 example, second-order counterpart of optimize_coeff.cfg: the same problem (truth runs,
# parameters and bounds, window, losses) solved with trust-constr using Hessian-vector products.
# The coeffs target is bounded (by the model's coefficient bounds and the per-parameter bounds
# below), and trust-constr is the only HVP-enabled scipy method that handles bounds; Newton-CG,
# trust-ncg and trust-krylov are rejected for this target unless optimizer.use_bounds is false.
# Only optimization_name and the optimizer section differ from optimize_coeff.cfg, so the two runs
# can be compared job by job (nit, nfev, njev, nhvp in result.yaml and history.csv).
# Run with:  bash workflows/optimize_params.sh 4 workflows/examples/optimize_coeff_trust_constr.cfg
optimization_name: physics-recovery-trust-constr
truth:
  manifest: ../generated/truth-physics/manifest.yaml
  mode: per-run
target: coeffs
parameters:
  threewayphysics.L: {initial: 7., bounds: [5., 13.]}
window:
  start_index: 0
  num_steps: 20
losses:
  - {type: final}
  - {type: windowed, window_steps: 4}
  - {type: trajectory, obs_every: 2}
normalize: true
optimizer:
  method: trust-constr
  use_hessp: true            # explicit; null (the default) also selects HVPs for trust-constr
  gtol: 1.0e-8               # trust-constr stops when the (projected) gradient norm is below gtol
  xtol: 1.0e-10              # ... or when the trust radius falls below xtol
  ftol: 1.0e-12              # unused by trust-constr; kept identical to the first-order example
  maxiter: 60
  check_gradient: false
output_root: runs/optimizations
