output:
 loglevel: 100
 output_freq: 2
 stat_freq: 1
 output_aux_vars: false
 outfile_name: resolved_hidden_c0

plot:
 static_plots: false

initial-conditions:
 name: doublevortex
 tracer_init_conds: []
 dg_tracer_init_conds: []
 ox: 0.1
 oy: 0.1

hyperviscosity:
 c0: 0.07
 s: 3.2
 treat_as_coeffs: true

threewayphysics:
 gamma_r: 0.001
 qprecip: 0.0001
 L: 10.0
 treat_as_coeffs: false

mesh:
 type: rectangle-periodic
 nx: 16
 ny: 16
 nz: 1
 diagonal:
 simplicial_cells: false

model:
 type: advdens-cf-h1
 poisson_bracket: none
 metric_bracket: none
 hamiltonian: mtswe
 forcing_terms: [hyperviscosity, dg1limiter, threewayphysics]
 tracer_names: []
 dg_tracer_names: []
 thermo: idealgas-entropy

spatial-discretization:
 order: 3
 family: Q
 alpha_s: 1.0
 upwind_v: true
 upwind_total_dens: true
 use_split_form:
  h: true
  S: true
 lump_mass: true

timestepping:
 method: LieSplit
 dt_type: direct
 dt: 400.0
 num_steps: 20
 termlist: [[model], [hyperviscosity], [dg1limiter], [threewayphysics]]
 timestepper_list: [RK4, Euler, SSPRK43, Euler]
 subcycle_list: [2, 1, 2, 1]
 avf_solver: qn
 num_avf_quad: 2
 kgrk2_name: 52
