initial-conditions:
 name: doublevortex
 tracer_init_conds: []
 dg_tracer_init_conds: []
 ox: 0.1
 oy: 0.1

mesh:
 type: rectangle-periodic
 nx: 2
 ny: 2
 nz: 1
 diagonal:
 simplicial_cells: false

model:
 type: advdens-cf-h1
 poisson_bracket: none
 metric_bracket: none
 hamiltonian: tswe
 forcing_terms: [hyperviscosity]
 tracer_names: []
 dg_tracer_names: []
 thermo: idealgas-entropy

spatial-discretization:
 order: 3
 family: Q
 alpha_s: 1.0
 upwind_v: true
 upwind_total_dens: true
 use_split_form:
  h: true
  S: true
 lump_mass: true

hyperviscosity:
 c0: 0.14
 s: 3.2
 treat_as_coeffs: true

timestepping:
 method: LieSplit
 dt_type: direct
 dt: 100.0
 termlist: [[model], [hyperviscosity]]
 timestepper_list: [RK4, Euler]
 subcycle_list: [1, 1]
 avf_solver: qn
 num_avf_quad: 2
 kgrk2_name: 52
 num_steps: 1
