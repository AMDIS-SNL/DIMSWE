# Steady-state example: recover kappa from an elliptic truth run (model.type: elliptic).
# 1. truth run (kappa = 2):  python run_model.py <truth cfg with elliptic.coefficients.kappa.value: 2.0>
#    (or a run directory with run.cfg + sim.h5 from run_batch.py)
# 2. optimize:               bash workflows/optimize_params.sh 1 workflows/examples/optimize_elliptic.cfg
# Elliptic truth runs are detected automatically and optimized without time stepping
# (see workflows/steady_state.py).
optimization_name: elliptic-kappa-recovery
truth:
  runs: [../../runs/elliptic-kappa-truth]
  mode: per-run                # steady-state problems are optimized per truth run
target: coeffs
parameters:
  elliptic.coefficients.kappa: {initial: 1.0, bounds: [0.1, 10.0], log: true}
#  elliptic.coefficients.mu:   {initial: 1.0, field: DG0, log: true}   # a DG0 field (serial only)
losses:
  - {type: steady, fields: [u]}
  - {type: steady, fields: [sigma, u], label: sigma-and-u}
optimizer:
  method: L-BFGS-B
  gtol: 1.0e-8
  ftol: 1.0e-12
  maxiter: 100
  check_gradient: false
output_root: runs/optimizations
