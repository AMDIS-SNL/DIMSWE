# Step 2 example: recover the full discrete initial state from the truth-doublevortex sweep.
# The initial guess is the analytic initial condition with the parameter values listed below.
# This target is serial only:  bash workflows/optimize_params.sh 1 workflows/examples/optimize_ic_field.cfg
optimization_name: doublevortex-field
truth:
  manifest: ../generated/truth-doublevortex/manifest.yaml
  mode: per-run
target: ic-field
parameters:
  initial-conditions.ox: {initial: 0.1}
  initial-conditions.oy: {initial: 0.105}
window:
  num_steps: 8
losses:
  - {type: final}
  - {type: trajectory, obs_every: 2}
normalize: true
optimizer:
  method: L-BFGS-B
  gtol: 1.0e-8
  ftol: 1.0e-12
  maxiter: 100
output_root: runs/optimizations
