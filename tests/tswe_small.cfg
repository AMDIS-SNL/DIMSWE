# Small test configuration: tests/tswe.cfg on an 8x8 mesh instead of 50x50 (39x fewer cells), so
# the gradient, HVP and end-to-end optimization tests run in reasonable time. Everything else
# (double vortex with ox = oy = 0.1, H1 order-3 Q discretization, hyperviscosity c0 = 0.07,
# s = 3.2 as coefficients, LieSplit RK4 x 2 + Euler, dt = 200) is unchanged, so the tests'
# perturbations of these values keep their meaning. The coarser mesh only makes the explicit
# steps more stable: the wave CFL number drops from about 0.5 to 0.08, and the hyperviscosity,
# c0 * (dx/order)^s acting on a projected Laplacian (biharmonic-like), scales as dx^(s-4).
# The tests only compare the model with itself (Taylor tests, a truth generated by the same
# model), so the under-resolved vortices do not matter.
initial-conditions:
 name: doublevortex #densitywave doublevortex TC5 TC2
 tracer_init_conds:  [] #[gaussian, block]
 dg_tracer_init_conds: [] #[gaussian, block]
 ox : 0.1
 oy : 0.1

mesh:
 type: rectangle-periodic
 nx: 8
 ny: 8
 nz: 100
 diagonal: #crossed
 simplicial_cells: false

model:
 type: advdens-cf-h1 #metriplectic advection
 poisson_bracket: none #none cf lp borninfeld lp-cocycle cf-cocycle hodgewave
 metric_bracket: none #none thermoviscousregularization
 hamiltonian: tswe # tswe mtswe ce mce mhd maxwell eulermaxwell scalarwave vectorwave
 forcing_terms: [hyperviscosity,] #[hyperviscosity,] #[hyperviscosity,] #[ ] #
 tracer_names: [] #[T1, T2]
 dg_tracer_names: [] #[DGT1, DGT2]
 thermo: idealgas-entropy




spatial-discretization:
 order: 3
 family: Q
 alpha_s: 1.0 #0 = centered, 1 = upwind
 upwind_v : true
 upwind_total_dens : true #NOT CURRENTLY USED?
 use_split_form:
  h: true
  S: true
  T1: true
  T2: true
  DGT1: false
  DGT2: false
 lump_mass: true


hyperviscosity:
 c0: 0.07
 s: 3.2
 treat_as_coeffs : true

#THESE ARE DYNAMICS TIME STEPS
#200s at nx=100, order=1 for tswe double vortex
#0.0001 at nx=100, order=1 for twse density wave

timestepping:
 method: LieSplit #AVF2 TimeStaggered SSPRK TimeSplit
 dt_type: direct
 dt: 200 #400
 termlist : [[model],  [hyperviscosity]] #
 timestepper_list : [RK4, Euler] #,
 subcycle_list : [2, 1] #1
 avf_solver : qn #fixedpoint qn
 num_avf_quad: 2
 kgrk2_name: 52 #32 42 52 53
