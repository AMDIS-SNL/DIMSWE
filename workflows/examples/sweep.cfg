template_cfg: ../../mtswe.cfg
sweep_name: mtswe-order-grid-flux
output_root: runs
run_name_template: "order-{spatial-discretization_order}__nx-{mesh_nx}"
parameters:
  spatial-discretization.order: [2, 3]
tied_parameter_sets:
  - mesh.nx: 25
    mesh.ny: 25
  - mesh.nx: 50
    mesh.ny: 50
refinement_scaling:
  refinement_keys: [mesh.nx, mesh.ny]
  reference_overrides:
    mesh.nx: 25
    mesh.ny: 25
    timestepping.dt: 800
    timestepping.num_steps: 500
    output.output_freq: 25
fixed:
  output.stat_freq: 1
