[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

# Enable bug-finding and correctness rules
select = [
    "F",    # Pyflakes (unused imports, undefined names)
    "E9",   # Syntax errors
    "B",    # Bugbear (likely bugs)
]

# Firedrake-style imports are common and acceptable
ignore = [
    "F403",  # from module import *
    "F405",  # name may be undefined from star imports
]

# Do not lint these directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]
