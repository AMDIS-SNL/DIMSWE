# Hodge Laplacian (d delta + delta d) u = f for a k-form u (see docs/hodge_laplacian.tex and
# TODO-elliptic.md). Run with: python run_model.py elliptic.cfg

model:
 type: elliptic

mesh:
 type: rectangle               # line | rectangle | box (or the *-periodic variants)
 periodic_directions: [x]      # optional, overrides the periodicity implied by the type
 nx: 32
 ny: 32
 nz: 32
 simplicial_cells: false       # family Q needs quadrilateral/hexahedral cells

spatial-discretization:
 family: Q
 order: 2
 lump_mass: false              # must be false for elliptic problems

elliptic:
 form_degree: 1                # k
 complex: curl-div             # 2D only: grad-curl | curl-div
 boundary_conditions:          # one entry per bounded face: essential | natural
  bottom: essential            # faces: left/right (x), bottom/top (y), back/front (z)
  top: essential
 boundary_data: exact          # exact | problem | homogeneous
 harmonic_forms: auto          # auto (Kunneth rule) | none
 harmonic_constraint: lagrange # lagrange | nullspace
 solver: elliptic-direct       # elliptic-direct | elliptic-direct-singular | elliptic-minres
 # quadrature_degree: 6        # default 2 * order + 2
 # solver_options: {ksp_monitor_true_residual: null}

elliptic-problem:
 name: sine                    # sine | polynomial | gaussian-source | boundary-driven | incompatible-source
 Lx: 1.0
 Ly: 1.0
 modes: [1, 2]

output:
 outfile_name: runs/elliptic/sim
 loglevel: 0
 output_aux_vars: false
 output_freq: 1
 stat_freq: 1
