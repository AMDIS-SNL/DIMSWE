output:
 loglevel: 100
 output_freq: 100
 stat_freq: 1
 output_aux_vars: false
 outfile_name: sim

initial-conditions:
 name: doublevortex #densitywave doublevortex TC5 TC2
 tracer_init_conds:  [] #[gaussian, block]
 dg_tracer_init_conds: [] #[gaussian, block]
 
mesh: 
 type: rectangle-periodic
 nx: 50
 ny: 50
 nz: 100
 diagonal: crossed
 simplicial_cells: false

model:
 class: advdens-cf-h1 #metriplectic advection
 type: mtswe-cf-h1 # tswe-cf tswe-lp tswe-cf-h1 ce-cf ce-lp mhd maxwell eulermaxwell scalarwave
 forcing_terms: [dg1limiter, hyperviscosity, threewayphysics]
 tracer_names: [] #[T1, T2]
 dg_tracer_names: [] #[DGT1, DGT2]
 thermo: idealgas-entropy



    
spatial-discretization:
 order: 3
 family: Q
 alpha_s: 1.0 #0 = centered, 1 = upwind
 upwind_v : true
 upwind_total_dens : true #NOT CURRENTLY USED?
 use_split_form:
  h: true
  S: true
  T1: true
  T2: true
  DGT1: false
  DGT2: false
 lump_mass: true


hyperviscosity:
 c0: 0.07
 s: 3.2

#THESE ARE DYNAMICS TIME STEPS
#200s at nx=100, order=1 for tswe double vortex
#0.0001 at nx=100, order=1 for twse density wave

timestepping:
 method: TimeSplit #AVF2 TimeStaggered SSPRK TimeSplit
 dt: 400
 num_steps: 2000
 timestepper_split_terms : [[model],  [hyperviscosity], [dg1limiter,], [threewayphysics,]]
 timestepper_list : [RK4, Euler, SSPRK43, Euler]
 timestepper_substeps : [2, 1, 2, 1]
 avf_solver : qn #fixedpoint qn
 num_avf_quad: 2 
 kgrk2_name: 52 #32 42 52 53


    
    

