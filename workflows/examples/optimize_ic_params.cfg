# Step 2 example: recover the double-vortex offsets (ox, oy) from the truth-doublevortex sweep.
# Gradients with respect to the parameters use UFL derivatives of the initial-condition expressions.
# Run with:  bash workflows/optimize_params.sh 4 workflows/examples/optimize_ic_params.cfg
optimization_name: doublevortex-params
truth:
  manifest: ../generated/truth-doublevortex/manifest.yaml
  mode: per-run
target: ic-params
parameters:
  initial-conditions.ox: {initial: 0.1, scale: 0.1}
  initial-conditions.oy: {initial: 0.105, scale: 0.1}
window:
  num_steps: 16
losses:
  - {type: final}
  - {type: trajectory, obs_every: 4}
normalize: true
optimizer:
  method: L-BFGS-B
  gtol: 1.0e-8
  ftol: 1.0e-12
  maxiter: 40
output_root: runs/optimizations
