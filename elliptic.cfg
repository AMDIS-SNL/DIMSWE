# Hodge Laplacian (d delta + delta d) u = f for a k-form u (see docs/hodge_laplacian.tex and
# TODO-elliptic.md). Run with: python run_model.py elliptic.cfg

model:
 type: elliptic

mesh:
 type: rectangle               # line | rectangle | box (or the *-periodic variants), unit-square, unit-cube,
                               # square, cube, periodic-unit-square, ..., tensor-rectangle/-box (x_coords, ...),
                               # unit-disk, unit-ball (refinement), annulus (inner_radius, outer_radius, nr, nt)
                               # surfaces: icosahedral-sphere, octahedral-sphere, cubed-sphere (radius, refinement,
                               #   degree), torus (R, r, nR, nr), cylinder-surface (radius, height, nr, nl)
 periodic_directions: [x]      # optional, overrides the periodicity implied by the type
 nx: 32
 ny: 32
 nz: 32
 simplicial_cells: false       # family Q needs quadrilateral/hexahedral cells
 # refinement_levels: 2        # multigrid hierarchy for riesz-gmg: nx/ny/nz = coarsest level

spatial-discretization:
 family: Q
 order: 2
 lump_mass: false              # must be false for elliptic problems

elliptic:
 form_degree: 1                # k
 complex: curl-div             # 2D only: grad-curl | curl-div
 boundary_conditions:          # one entry per bounded face: essential | natural
  bottom: essential            # faces: left/right (x), bottom/top (y), back/front (z)
  top: essential
 boundary_data: exact          # exact | problem | homogeneous
 harmonic_forms: auto          # auto (Kunneth rule; numerical on 'file' meshes) | none | numerical
 # harmonic_method: eigen      # numerical harmonic forms: eigen (SLEPc) | kernel (inverse iteration)
 # harmonic_forms_count: 1     # optional known count (otherwise the Betti number is computed)
 harmonic_constraint: lagrange # lagrange | nullspace
 solver: elliptic-direct       # direct: elliptic-direct | elliptic-direct-singular | elliptic-minres
                               # iterative: riesz-amg | riesz-gmg (needs mesh.refinement_levels) | riesz-pmg (order >= 2)
                               #            | schur-mass (form_degree = dim)
 # block_solvers: {H1: hypre, Hcurl: auto, Hdiv: auto, L2: bjacobi}   # per-space variants, 'lu' = exact
 # ksp_rtol: 1.0e-10
 # quadrature_degree: 6        # default 2 * order + 2
 # solver_options: {ksp_monitor_true_residual: null}

elliptic-problem:
 name: sine                    # sine | polynomial | gaussian-source | boundary-driven | incompatible-source
 Lx: 1.0
 Ly: 1.0
 modes: [1, 2]

output:
 outfile_name: runs/elliptic/sim
 loglevel: 0
 output_aux_vars: false
 output_freq: 1
 stat_freq: 1
