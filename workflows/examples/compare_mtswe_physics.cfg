runs:
  - run_dir: ../../runs/mtswe-cf-physics
    label: "CF"
  - run_dir: ../../runs/mtswe-lp-physics
    label: "LP"
  - run_dir: ../../runs/mtswe-h1-physics
    label: "H1"
reference: CF          # differences are drawn as <run> - CF
differences: true
samples_per_cell: 4    # used if the runs' meshes are numbered differently
quantities:
  # dynamics, then moisture: prognostic densities, per-unit-mass mixing ratios, and relative humidity
  fields: [h, eta, Qv, Qc, Qr, Qv_l, Qc_l, Qr_l, rh]
  statistics: [total_energy, total_h, total_water, total_Qv, total_Qc, total_Qr]
time_selection:
  frames: [0, 5, 10, 20]
output:
  outdir: ../../runs/comparisons/mtswe-physics-h1-cf-lp
